spring.application.name=foro-contenido
spring.profiles.default=local
spring.jpa.open-in-view=false
server.port=${PORT:8082}
usuarios.base-url=${USUARIOS_BASE_URL:http://localhost:8081}
usuarios.connect-timeout=${USUARIOS_CONNECT_TIMEOUT:2s}
usuarios.read-timeout=${USUARIOS_READ_TIMEOUT:3s}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
